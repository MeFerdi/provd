# Render's free plan puts the API to sleep after 15 minutes without traffic (about a minute to wake), which
# would also pause the in-process worker. A health check every 10 minutes keeps it awake: one service running
# all month is about 744 hours, inside the 750 free hours. Remove this when the API moves to a paid plan or a VPS.
name: Keep API warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://api.provd.tech/v1/health
