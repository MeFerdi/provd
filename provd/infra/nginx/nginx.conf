user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON access log — request_id forwarded from upstream
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":"$status",'
            '"bytes_sent":"$bytes_sent",'
            '"request_time":"$request_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"host":"$host",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"x_request_id":"$upstream_http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Hide nginx version in error pages and headers
    server_tokens off;

    # Limit request body to 64kb — Provd request payloads are small JSON
    client_max_body_size 64k;

    # Gzip for JSON responses
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Rate limiting zones — keyed by API key header prefix
    # Burst limits here are a first line of defence; quota enforcement is in-app
    limit_req_zone $http_authorization zone=api_burst:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ip_burst:10m  rate=60r/s;

    # Upstream definitions
    include /etc/nginx/conf.d/upstream.conf;

    # Virtual host configs
    include /etc/nginx/conf.d/api.provd.io.conf;
    include /etc/nginx/conf.d/sandbox.api.provd.io.conf;
}
