# Production API — api.provd.io
# Handles: POST /v1/counterparties/score, POST /v1/disputes/analyze, GET /v1/health

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.provd.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.provd.io;

    # TLS — managed by certbot; paths generated on first certificate issuance
    ssl_certificate     /etc/letsencrypt/live/api.provd.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.provd.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    include /etc/nginx/snippets/security_headers.conf;

    # Health endpoint — no auth, no rate limit, used for uptime monitoring
    # Must always be reachable even during incidents
    location = /v1/health {
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://provd_api;

        # Bypass rate limiting for health checks
        limit_req_status 429;
        access_log off;
    }

    # Score endpoint — primary workflow, latency-sensitive
    # Rate limiting: 30 req/s burst per authorisation token
    location = /v1/counterparties/score {
        limit_req zone=api_burst burst=10 nodelay;
        limit_req zone=ip_burst burst=20 nodelay;

        # Only POST is valid
        if ($request_method != POST) {
            return 405;
        }

        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://provd_api;
    }

    # Dispute analysis — Growth/Enterprise plans only
    # Latency SLO is 5s P95; timeout extended accordingly
    location = /v1/disputes/analyze {
        limit_req zone=api_burst burst=5 nodelay;

        if ($request_method != POST) {
            return 405;
        }

        include /etc/nginx/snippets/proxy_params.conf;
        proxy_read_timeout 10s;  # Buffer above 5s SLO to avoid premature 502
        proxy_pass http://provd_api;
    }

    # Block anything outside the defined API surface — return 404 not 403
    # Prevents path enumeration
    location / {
        return 404 '{"error":"NOT_FOUND","message":"Endpoint not found.","request_id":null}';
        add_header Content-Type application/json always;
    }
}
