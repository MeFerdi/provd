# Sandbox API — sandbox.api.provd.io
# Handles pvd_test_ keys only; returns deterministic mock responses.
# No quota impact. All responses match the production contract exactly.

server {
    listen 80;
    server_name sandbox.api.provd.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sandbox.api.provd.io;

    ssl_certificate     /etc/letsencrypt/live/sandbox.api.provd.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.api.provd.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security_headers.conf;

    # Sandbox-specific header so operators can confirm they hit the right environment
    add_header X-Provd-Environment "sandbox" always;

    location = /v1/health {
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://provd_sandbox;
        access_log off;
    }

    location = /v1/counterparties/score {
        # Sandbox keys are used for integration testing — allow higher burst
        limit_req zone=ip_burst burst=50 nodelay;

        if ($request_method != POST) {
            return 405;
        }

        include /etc/nginx/snippets/proxy_params.conf;
        proxy_pass http://provd_sandbox;
    }

    location = /v1/disputes/analyze {
        limit_req zone=ip_burst burst=20 nodelay;

        if ($request_method != POST) {
            return 405;
        }

        include /etc/nginx/snippets/proxy_params.conf;
        proxy_read_timeout 10s;
        proxy_pass http://provd_sandbox;
    }

    location / {
        return 404 '{"error":"NOT_FOUND","message":"Endpoint not found.","request_id":null}';
        add_header Content-Type application/json always;
    }
}
