# Standard proxy headers — include in every location block that proxies to FastAPI
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTP/1.1 + Connection: "" enables keep-alive to upstream
proxy_http_version 1.1;
proxy_set_header Connection "";

# Timeouts tuned to Provd latency SLOs:
# - Cached score path: <50ms P95
# - Cold start / provisional: <100ms P95
# - Full score computation (background): <200ms P95
# Gateway timeout set to 5s to accommodate dispute analysis endpoint (5s P95 SLO)
proxy_connect_timeout 5s;
proxy_send_timeout    5s;
proxy_read_timeout    5s;

# Buffer settings
proxy_buffering    on;
proxy_buffer_size  8k;
proxy_buffers      4 16k;
