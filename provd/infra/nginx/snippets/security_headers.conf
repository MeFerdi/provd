# Security headers — applied to all API responses
# Provd is a B2B JSON API; headers are tailored accordingly

# Force HTTPS for all future requests from this origin
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Deny framing entirely — this is an API, not a web page
add_header X-Frame-Options "DENY" always;

# Referrer policy — no referrer on cross-origin requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrictive permissions policy — no browser features needed for a JSON API
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP — minimal, since this serves JSON not HTML
add_header Content-Security-Policy "default-src 'none'" always;

# Remove upstream server header
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
