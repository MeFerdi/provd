version: '3.9'
services:
  frontend:
    build: ./frontend
    command: npm run start
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local.example
    networks:
      - provd_network
  backend:
    build: ./backend
    command: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres
      - redis
      - ml
    networks:
      - provd_network
  ml:
    build: ./ml
    command: python serve.py
    ports:
      - "8001:8001"
    env_file:
      - ./ml/.env.example
    networks:
      - provd_network
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: provd
      POSTGRES_PASSWORD: provd
      POSTGRES_DB: provd
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - provd_network
  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    networks:
      - provd_network
  celery_worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      - redis
    env_file:
      - ./backend/.env.example
    networks:
      - provd_network
volumes:
  pgdata:
networks:
  provd_network:
    driver: bridge
